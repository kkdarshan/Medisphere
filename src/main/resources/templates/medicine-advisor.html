<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Medicine Advisor - Medisphere</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #cce5ff, #f2f7ff);
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      background-color: #1a73e8;
      color: white;
      padding: 20px;
      margin: 0;
    }

    .container {
      background: white;
      width: 60%;
      margin: 40px auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    input[type=text] {
      width: 80%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #1a73e8;
      border: none;
      color: white;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover { background: #0b59d1; }

    table {
      width: 100%;
      margin-top: 30px;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
    }

    th { background: #1a73e8; color: white; }

    .back-btn {
      display: inline-block;
      margin-top: 20px;
      background: #1a73e8;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: 600;
      transition: 0.3s;
    }

    .back-btn:hover { background: #0b59d1; }
  </style>
</head>
<body>
  <h1>🧠 Smart Medicine Advisor</h1>

  <div class="container">
    <form th:action="@{/medicines/advise}" method="get">
      <input type="text" name="diagnosis" placeholder="Enter your diagnosis (e.g. fever, cough, headache)" required>
      <br>
      <button type="submit">Find Medicines</button>
    </form>

    <div th:if="${medicines}">
      <h2 style="margin-top: 30px;">💊 Suggested Medicines</h2>
      <table>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Manufacturer</th>
          <th>Price (₹)</th>
          <th>Expiry</th>
        </tr>
        <tr th:each="m : ${medicines}">
          <td th:text="${m.name}"></td>
          <td th:text="${m.type}"></td>
          <td th:text="${m.manufacturer}"></td>
          <td th:text="${m.price}"></td>
          <td th:text="${#temporals.format(m.expiryDate, 'dd-MM-yyyy')}"></td>
        </tr>
      </table>
    </div>

    <div th:if="${message}">
      <p style="color:red; margin-top:20px;" th:text="${message}"></p>
    </div>

    <a href="/home" class="back-btn">⬅ Back to Dashboard</a>
  </div>
</body>
</html>
