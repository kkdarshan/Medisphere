<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Book Appointment</title>
  <style>
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg,#cce5ff,#f2f7ff); text-align:center; margin:0; padding:0; }
    .card { width:420px; margin:60px auto; background:white; padding:25px; border-radius:12px; box-shadow:0 8px 25px rgba(0,0,0,0.15); text-align:left; }
    h2 { color:#1a73e8; text-align:center; }
    label { display:block; margin-top:12px; font-weight:600; }
    input { width:100%; padding:8px; border-radius:5px; border:1px solid #ccc; margin-top:5px; }
    button { margin-top:20px; width:100%; background:#1a73e8; color:white; border:none; border-radius:6px; padding:10px; font-weight:bold; cursor:pointer; }
    button:hover { background:#0b59d1; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Book Appointment</h2>

    <form th:action="@{/appointments/book}" method="post">
      <input type="hidden" name="doctorId" th:value="${doctorId}">
      <label>Your Name</label>
      <input type="text" name="patientName" required>
      <label>Your Email</label>
      <input type="email" name="patientEmail" required>
      <label>Select Date & Time</label>
      <input type="datetime-local" name="appointmentDateTime" required>
      <button type="submit">Confirm Appointment</button>
    </form>
  </div>
</body>
</html>
