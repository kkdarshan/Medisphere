<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Registration - Medisphere</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #cce5ff, #f2f7ff);
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      background-color: #1a73e8;
      color: white;
      padding: 15px 0;
      margin: 0;
    }
    .container {
      margin: 40px auto;
      width: 80%;
      background: white;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    input, button {
      padding: 8px;
      margin: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 90%;
    }
    button {
      cursor: pointer;
      background-color: #1a73e8;
      color: white;
      border: none;
      width: 150px;
      font-weight: bold;
    }
    button:hover {
      background-color: #155cb0;
    }
    table {
      width: 100%;
      margin-top: 30px;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
    }
    th {
      background-color: #1a73e8;
      color: white;
    }
    .success {
      color: green;
      margin-top: 15px;
      font-weight: bold;
      animation: fadeIn 1s ease-in;
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>
  <h1>Welcome to Medisphere Hospital Registration</h1>

  <div class="container">
    <h2>Register as a Patient</h2>
    <form th:action="@{/register}" method="post">
      <input type="text" name="name" placeholder="Full Name" required><br>
      <input type="number" name="age" placeholder="Age" required><br>
      <input type="email" name="email" placeholder="Email Address" required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <input type="text" name="diagnosis" placeholder="Diagnosis (optional)"><br>
      <button type="submit">Register</button>
    </form>

    <div th:if="${success}" class="success">
      <p th:text="${success}"></p>
      <p><a href="/home" style="color:#1a73e8; text-decoration:none; font-weight:bold;">Go to Dashboard →</a></p>
    </div>

    <h2 style="margin-top: 30px;">Recently Registered Users</h2>
    <table>
      <tr>
        <th>ID</th><th>Name</th><th>Email</th><th>Age</th><th>Diagnosis</th><th>Registered On</th>
      </tr>
      <tr th:each="r : ${registrations}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.name}"></td>
        <td th:text="${r.email}"></td>
        <td th:text="${r.age}"></td>
        <td th:text="${r.diagnosis}"></td>
        <td th:text="${#temporals.format(r.registrationDate, 'dd-MM-yyyy HH:mm')}"></td>
      </tr>
    </table>
  </div>
</body>
</html>
